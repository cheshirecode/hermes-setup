# ==============================================================================
# Hermes Agent Configuration (Primary: Hermes/Nous Portal -> Fallback: OpenRouter)
# ==============================================================================

custom_providers:
  - name: hermes_portal
    base_url: https://inference-api.nousresearch.com/v1
    transport: openai_chat

model:
  provider: hermes_portal
  default: z-ai/glm-5.2

fallback_providers:
  - provider: openrouter
    model: openrouter/free

terminal:
  backend: local
  timeout: 180

memory:
  enabled: true

display:
  interface: tui
  reasoning: true
